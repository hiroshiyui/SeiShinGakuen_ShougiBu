# Pinned AppImage tooling. tools/build_appimage.sh downloads these from
# the `continuous` tags of AppImage/appimagetool and AppImage/type2-runtime
# into tools/.cache/appimage/ and refuses to proceed if a SHA-256 differs,
# so a moving upstream tag can't silently change what we ship.
#
# To bump: delete tools/.cache/appimage/, run the script with
# APPIMAGE_LOCK_UPDATE=1, review the new hashes, commit this file.

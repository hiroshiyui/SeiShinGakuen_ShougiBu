[package]
name = "shogi_core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { version = "0.5", features = ["experimental-threads"] }
tract-onnx = "0.23"
rand = "0.10"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
